<svg width="680" height="578" viewBox="0 0 680 578" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Обновлённая архитектура jobscraper</title>
<desc>jobs.cz листинги идут в scrape.ts, который через upsertScraped пишет в единый стор data/jobs.json. AI-модули (Gemini/Groq) читают из стора неоценённые вакансии и через upsertAssessment домёргивают оценку в ту же запись по id. exportToExcel.ts читает весь стор и выгружает все поля в jobs.xlsx.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="578" fill="#ffffff"/>

<g>
<rect x="230" y="30" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="325" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">jobs.cz listings</text>
</g>
<line x1="325" y1="74" x2="325" y2="134" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="215" y="134" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="325" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#04342C">scrape.ts</text>
<text x="325" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Playwright scraper</text>
</g>
<line x1="325" y1="190" x2="325" y2="250" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="222" dominant-baseline="central" font-size="12" fill="#5f5e5a">upsertScraped(jobs)</text>

<g>
<rect x="200" y="250" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="325" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#26215C">jobs.json store</text>
<text x="325" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">JobRecord, keyed by id</text>
</g>

<line x1="450" y1="278" x2="495" y2="278" stroke="#5f5e5a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="472" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5f5e5a">merge by id</text>

<g>
<rect x="495" y="250" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="565" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#4A1B0C">AI processors</text>
<text x="565" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Gemini / Grok</text>
</g>

<line x1="325" y1="306" x2="325" y2="366" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="215" y="366" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="325" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#04342C">exportToExcel.ts</text>
<text x="325" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">getAllRecords()</text>
</g>
<line x1="325" y1="422" x2="325" y2="482" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="225" y="482" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="325" y="500" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#2C2C2A">jobs.xlsx</text>
<text x="325" y="520" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">all fields incl. AI</text>
</g>
</svg>
